<script>
  (function () {
    var clock = document.getElementById('clock');
    function tick() {
      if (!clock) return;
      var d = new Date();
      clock.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    tick();
    setInterval(tick, 15000);
  })();
</script>
