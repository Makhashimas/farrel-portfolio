<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Farrel Fayzul Haqqi</title>
<meta name="description" content="Page not found.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e27">
<link rel="icon" href="/farrel-portfolio/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0e27;
    --night-2: #131a3a;
    --navy: #1e2a5a;
    --navy-lite: #2d3d7a;
    --ink: #0b0f24;
    --paper: #e8ecf7;
    --paper-dim: #a8b3d4;
    --cyan: #3de8c4;
    --gold: #ffd34d;
    --rose: #ff5c8a;
    --f-pixel: 'Press Start 2P', 'Courier New', monospace;
    --f-term: 'VT323', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--night);
    color: var(--paper);
    font-family: var(--f-term);
    font-size: 20px;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: none;
  }
  .wrap { width: 100%; max-width: 620px; }
  .win {
    background: var(--night-2);
    border: 4px solid var(--navy-lite);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .win__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--rose);
    border-bottom: 4px solid var(--ink);
    padding: 12px 14px;
  }
  .win__title {
    font-family: var(--f-pixel);
    font-size: 12px;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .win__ctrls { display: flex; gap: 6px; }
  .win__ctrls i {
    width: 12px; height: 12px; display: block;
    background: var(--ink); border: 2px solid var(--ink);
  }
  .win__body { padding: 30px 26px 34px; }
  .code {
    font-family: var(--f-pixel);
    font-size: 46px;
    color: var(--gold);
    line-height: 1.2;
    text-shadow: 4px 4px 0 var(--ink);
    margin: 0 0 18px;
  }
  p { margin: 0 0 14px; }
  .dim { color: var(--paper-dim); }
  .term {
    background: var(--ink);
    border: 3px solid var(--navy);
    padding: 14px 16px;
    font-size: 19px;
    margin: 22px 0 26px;
  }
  .term b { color: var(--cyan); font-weight: normal; }
  .btn {
    display: inline-block;
    font-family: var(--f-pixel);
    font-size: 12px;
    background: var(--gold);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 15px 20px;
    text-decoration: none;
    transition: transform .1s steps(2), box-shadow .1s steps(2);
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="win">
    <div class="win__bar">
      <span class="win__title">ERROR.EXE</span>
      <span class="win__ctrls" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="win__body">
      <p class="code">404</p>
      <p>That page does not exist. It may have moved, or the link was mistyped.</p>
      <p class="dim">The rest of the site is still running.</p>

      <div class="term">
        <b>C:\&gt;</b> find /requested-page<br>
        <b>C:\&gt;</b> result: 0 files found
      </div>

      <a class="btn" href="/farrel-portfolio/">BACK TO PORTFOLIO</a>
    </div>
  </div>
</div>
</body>
</html>
